services:
  fastgpt-app:
    image: ${CUSTOMER_SERVICE_IMAGE:?CUSTOMER_SERVICE_IMAGE is required}
    restart: always
    ports: !override
      - 127.0.0.1:3000:3000
    environment:
      FE_DOMAIN: ${CUSTOMER_SERVICE_DOMAIN:?CUSTOMER_SERVICE_DOMAIN is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      ROOT_KEY: ${FASTGPT_ROOT_KEY:?FASTGPT_ROOT_KEY is required}
      DEFAULT_ROOT_PSW: ${FASTGPT_ROOT_PASSWORD:?FASTGPT_ROOT_PASSWORD is required}
      FILE_TOKEN_KEY: ${FASTGPT_FILE_TOKEN_KEY:?FASTGPT_FILE_TOKEN_KEY is required}
      AES256_SECRET_KEY: ${FASTGPT_AES256_SECRET_KEY:?FASTGPT_AES256_SECRET_KEY is required}
      INVOKE_TOKEN_SECRET: ${FASTGPT_INVOKE_TOKEN_SECRET:?FASTGPT_INVOKE_TOKEN_SECRET is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      PG_URL: ${PG_URL:?PG_URL is required}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
      AIPROXY_API_TOKEN: ${AIPROXY_API_TOKEN:?AIPROXY_API_TOKEN is required}
      LOG_ENABLE_CONSOLE: "true"
      LOG_CONSOLE_LEVEL: info
      LOG_ENABLE_OTEL: "true"
      LOG_OTEL_LEVEL: info
      LOG_OTEL_URL: ${LOG_OTEL_URL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/common/system/getInitData').then((res)=>{if(!res.ok)throw new Error(String(res.status))})
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

  fastgpt-mongo:
    restart: always
    ports: !reset []
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongo --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}"
          -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -s /data/mongodb.key ]; then
          openssl rand -base64 128 > /data/mongodb.key
          chmod 400 /data/mongodb.key
          chown 999:999 /data/mongodb.key
        fi
        cat >/data/initReplicaSet.js <<'EOF'
        if (rs.status().ok !== 1) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'fastgpt-mongo:27017'}]})
        }
        EOF
        docker-entrypoint.sh "$${@}" &
        cs_mongo_pid="$$!"
        until mongo --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping')"; do
          sleep 2
        done
        mongo --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin /data/initReplicaSet.js
        wait "$${cs_mongo_pid}"
      - --

  fastgpt-redis:
    restart: always
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$${REDIS_PASSWORD}" --loglevel warning --maxclients 10000 --appendonly yes --save 60 10 --maxmemory 4gb --maxmemory-policy noeviction
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']

  fastgpt-minio:
    restart: always
    ports: !override
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}

  fastgpt-vector:
    restart: always
    ports: !reset []
    environment:
      POSTGRES_USER: ${VECTOR_PG_USER:?VECTOR_PG_USER is required}
      POSTGRES_PASSWORD: ${VECTOR_PG_PASSWORD:?VECTOR_PG_PASSWORD is required}
      POSTGRES_DB: ${VECTOR_PG_DATABASE:?VECTOR_PG_DATABASE is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"

  fastgpt-aiproxy:
    restart: always
    ports: !reset []
    environment:
      ADMIN_KEY: ${AIPROXY_API_TOKEN:?AIPROXY_API_TOKEN is required}
      SQL_DSN: postgres://${AIPROXY_PG_USER:?AIPROXY_PG_USER is required}:${AIPROXY_PG_PASSWORD:?AIPROXY_PG_PASSWORD is required}@fastgpt-aiproxy-pg:5432/${AIPROXY_PG_DATABASE:?AIPROXY_PG_DATABASE is required}

  fastgpt-aiproxy-pg:
    restart: always
    environment:
      POSTGRES_USER: ${AIPROXY_PG_USER:?AIPROXY_PG_USER is required}
      POSTGRES_PASSWORD: ${AIPROXY_PG_PASSWORD:?AIPROXY_PG_PASSWORD is required}
      POSTGRES_DB: ${AIPROXY_PG_DATABASE:?AIPROXY_PG_DATABASE is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"

  fastgpt-mcp-server:
    restart: always
    ports: !override
      - 127.0.0.1:3003:3000

  customer-service-client:
    image: ${CUSTOMER_SERVICE_CLIENT_IMAGE:?CUSTOMER_SERVICE_CLIENT_IMAGE is required}
    restart: always
    ports: !override
      - 127.0.0.1:3002:80
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:80/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
